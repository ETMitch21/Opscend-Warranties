<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warranty status</title><link rel="stylesheet" href="/ui.css"></head><body><main class="container"><h1>Warranty claim status</h1><p>Enter your claim access code to view your request. Your payment is verified by the shop, not by this page.</p><label>Claim access code<input id="code" autocomplete="off" type="password"></label><button id="check">Check status</button><button class="secondary" id="smsOptOut">Stop SMS notifications for this claim</button><details><summary>Lost your access code?</summary><p>Enter the email address used for your claim to receive a new verification code.</p><label>Email<input id="recoverEmail" type="email" autocomplete="email"></label><button id="recover">Send verification code</button><label>Six-digit code<input id="recoveryOtp" inputmode="numeric" maxlength="6"></label><button id="verifyRecovery">Verify and get new access code</button></details><p id="status" role="status"></p></main><script src="/status.js" defer></script></body></html>
